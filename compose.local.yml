services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: transit_local
      POSTGRES_DB: transit_local
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Run dev-local.js first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit_local -d transit_local"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${LOCAL_REDIS_PASSWORD:?Run dev-local.js first}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
